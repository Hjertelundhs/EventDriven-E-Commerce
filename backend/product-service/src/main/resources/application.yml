spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${PRODUCT_DB_USER:product_app}
    password: ${PRODUCT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PRODUCT_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        compression.type: zstd
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PRODUCT_SERVICE_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 100
      min-spare: 10

product:
  cache:
    time-to-live: ${PRODUCT_CACHE_TTL:PT10M}
  outbox:
    topic: commerce.product.v1
    batch-size: ${PRODUCT_OUTBOX_BATCH_SIZE:50}
    poll-interval: ${PRODUCT_OUTBOX_POLL_INTERVAL:PT1S}
    publish-timeout: ${PRODUCT_OUTBOX_PUBLISH_TIMEOUT:PT10S}
    publisher-enabled: ${PRODUCT_OUTBOX_PUBLISHER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.eventdrivencommerce.product: INFO
  file:
    name: ${LOG_FILE:logs/product-service.json}
  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: 0.1.0
        environment: ${ENVIRONMENT:local}
