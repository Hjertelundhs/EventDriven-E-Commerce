spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_app}
    password: ${ORDER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: true
    serialization.write-dates-as-timestamps: false

server:
  port: ${ORDER_SERVICE_PORT:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

order:
  product-service-base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
  product-connect-timeout: ${PRODUCT_CONNECT_TIMEOUT:PT2S}
  product-read-timeout: ${PRODUCT_READ_TIMEOUT:PT3S}
  outbox:
    topic: commerce.order.v1
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:50}
    poll-interval: ${ORDER_OUTBOX_POLL_INTERVAL:PT1S}
    publish-timeout: ${ORDER_OUTBOX_PUBLISH_TIMEOUT:PT10S}
    publisher-enabled: ${ORDER_OUTBOX_PUBLISHER_ENABLED:true}

resilience4j:
  circuitbreaker.instances.productCatalog:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
  retry.instances.productCatalog:
    max-attempts: 3
    wait-duration: 150ms

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
  metrics.tags:
    application: ${spring.application.name}
    environment: ${ENVIRONMENT:local}
  tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs.version: openapi_3_1
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.eventdrivencommerce.order: INFO
  file.name: ${LOG_FILE:logs/order-service.json}
  structured.format:
    console: ecs
    file: ecs
