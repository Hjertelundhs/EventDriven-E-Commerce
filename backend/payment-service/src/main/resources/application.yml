spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USER:payment_app}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${PAYMENT_KAFKA_GROUP_ID:payment-service-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: zstd
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null
    serialization.write-dates-as-timestamps: false

server:
  port: ${PAYMENT_SERVICE_PORT:8085}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

payment:
  simulation-mode: ${PAYMENT_SIMULATION_MODE:SUCCESS}
  outbox:
    topic: commerce.payment.v1
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:50}
    poll-interval: ${PAYMENT_OUTBOX_POLL_INTERVAL:PT1S}
    publish-timeout: ${PAYMENT_OUTBOX_PUBLISH_TIMEOUT:PT10S}
    publisher-enabled: ${PAYMENT_OUTBOX_PUBLISHER_ENABLED:true}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: never
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
  metrics.tags:
    application: ${spring.application.name}
    environment: ${ENVIRONMENT:local}
  tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs.version: openapi_3_1

logging:
  level:
    root: INFO
    com.eventdrivencommerce.payment: INFO
  file.name: ${LOG_FILE:logs/payment-service.json}
  structured.format:
    console: ecs
    file: ecs
