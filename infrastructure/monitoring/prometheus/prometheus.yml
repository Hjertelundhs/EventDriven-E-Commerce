global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: order-logistics

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          application: keycloak

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          application: kafka

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          application: redis

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          application: postgres

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          application: loki

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          application: tempo

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          application: alloy
